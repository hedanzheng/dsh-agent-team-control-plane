name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run test:demo
      - run: npm pack --dry-run
